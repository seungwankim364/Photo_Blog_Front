name: Deploy Frontend to S3 and CloudFront

on:
  push:
    branches:
      - main  # main 브랜치에 push될 때 실행

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # 사용 중인 노드 버전

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }} # GitHub Secret에서 가져와 빌드에 주입

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2 # 본인의 리전

      - name: Deploy to S3
        run: |
          # --delete 옵션을 주면 S3에만 있고 로컬(dist)엔 없는 파일을 알아서 지워줍니다. (수동 삭제 필요 없음!)
          aws s3 sync dist/ s3://photo-blog-s3-651914029420 --delete

      - name: CloudFront Invalidation
        run: |
          # CloudFront 캐시를 강제로 비워 새 파일을 즉시 반영합니다.
          aws cloudfront create-invalidation --distribution-id E3BV7I676ZG6WM --paths "/*"